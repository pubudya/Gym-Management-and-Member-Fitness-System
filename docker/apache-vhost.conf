<VirtualHost *:@PORT@>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>
    <Directory /var/www/html/database>
        Require all denied
    </Directory>
    <Directory /var/www/html/java>
        Require all denied
    </Directory>
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>
    <Directory /data/receipts>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
